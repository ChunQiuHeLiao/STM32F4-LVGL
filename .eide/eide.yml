version: "4.1"
name: MobilePhone_F4
type: ARM
deviceName: null
packDir: null
srcDirs:
  - Core
  - Drivers
  - Middlewares
  - My_Drivers
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: StartUp
      files:
        - path: startup_stm32f411xe.s
      folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: e3f6824147830df5ca4e576e65123f0b
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - STM32F411xE
      incList: []
      libList: []
    excludeList:
      - Middlewares/PICTURE
      - Middlewares/FreeRTOS
      - Middlewares/LVGL/Drivers/examples
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-size
            warnings: all-warnings
          global:
            $float-abi-type: hard
            arm-thumb-mode: thumb
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            $toolName: auto
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32F411XX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      STLink:
        address: "0x08000000"
        bin: build/Debug/MobilePhone_F4.hex
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
    uploader: STLink
